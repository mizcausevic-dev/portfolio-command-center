name: Build and Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build dist/ and FTP-sync to portfolio.kineticgain.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify dist/ contains Portfolio Command Center
        run: |
          test -f dist/index.html || (echo "FAIL: no dist/index.html" && exit 1)
          grep -q "Portfolio Command Center" dist/index.html || (echo "FAIL: dist/index.html does not mention Portfolio Command Center" && exit 1)
          test -f dist/robots.txt || (echo "FAIL: no dist/robots.txt" && exit 1)
          test -f dist/sitemap.xml || (echo "FAIL: no dist/sitemap.xml" && exit 1)
          echo "OK: dist/ verified"
          ls -lah dist/

      - name: FTP-Deploy dist/ to /portfolio/ (first attempt)
        id: deploy
        timeout-minutes: 5
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          timeout: 60000
          local-dir: ./dist/
          server-dir: /portfolio/
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      - name: Retry FTP-Deploy if first attempt failed
        if: steps.deploy.outcome == 'failure'
        timeout-minutes: 5
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          timeout: 90000
          local-dir: ./dist/
          server-dir: /portfolio/
          dangerous-clean-slate: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store

      - name: Post-deploy verification
        run: |
          for path in / /robots.txt /sitemap.xml; do
            status=$(curl -sIo /dev/null -w "%{http_code}" "https://portfolio.kineticgain.com$path")
            if [ "$status" != "200" ]; then
              echo "FAIL: https://portfolio.kineticgain.com$path -> $status"
              exit 1
            fi
          done
          echo "OK: portfolio.kineticgain.com root, robots, and sitemap are live"
