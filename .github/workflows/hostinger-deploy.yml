name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-portfolio-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
      TARGET_NAME: portfolio
      LIVE_URL: https://portfolio.kineticgain.com/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SSH_HOST}"
          test -n "${SSH_PORT}"
          test -n "${SSH_USER}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/hostinger_deploy_key
          chmod 600 ~/.ssh/hostinger_deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Upload build to staging
        id: ssh_upload
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target_parent="/home/${SSH_USER}/domains/kineticgain.com/public_html"
          release_dir="${target_parent}/.${TARGET_NAME}-release-${GITHUB_SHA}"
          ssh -i ~/.ssh/hostinger_deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${release_dir}'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/hostinger_deploy_key -p ${SSH_PORT}" \
            dist/ "${SSH_USER}@${SSH_HOST}:${release_dir}/"

      - name: Validate staging and swap live folder
        id: ssh_swap
        if: steps.ssh_upload.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          target_parent="/home/${SSH_USER}/domains/kineticgain.com/public_html"
          release_dir="${target_parent}/.${TARGET_NAME}-release-${GITHUB_SHA}"
          target_dir="${target_parent}/${TARGET_NAME}"
          backup_dir="${target_parent}/.${TARGET_NAME}-backup-${GITHUB_SHA}"
          ssh -i ~/.ssh/hostinger_deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "
            set -e
            test -f '${release_dir}/index.html'
            grep -q 'Portfolio Command Center' '${release_dir}/index.html'
            if [ -d '${target_dir}' ]; then
              mv '${target_dir}' '${backup_dir}'
            fi
            if mv '${release_dir}' '${target_dir}'; then
              echo 'Portfolio deploy swap complete.'
            else
              if [ -d '${backup_dir}' ]; then
                mv '${backup_dir}' '${target_dir}'
              fi
              exit 1
            fi
          "

      - name: FTP fallback when SSH is unreachable
        id: ftp_fallback
        if: steps.ssh_upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          timeout: 90000
          local-dir: ./dist/
          server-dir: /portfolio/
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.DS_Store

      - name: Verify live portfolio
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsSL --retry 5 --retry-delay 3 "${LIVE_URL}")"
          asset="$(printf '%s' "${html}" | grep -oE '/assets/[^"]+\.js' | head -n 1)"
          test -n "${asset}"
          bundle="$(curl -fsSL --retry 5 --retry-delay 3 "${LIVE_URL%/}${asset}")"
          printf '%s' "${bundle}" | grep -q 'gcp-bigquery-slot-commitment-advisor'
          printf '%s' "${bundle}" | grep -q 'snowflake-query-credit-guardrail'
          printf '%s' "${bundle}" | grep -q 'ibm-watsonx-model-risk-register'
